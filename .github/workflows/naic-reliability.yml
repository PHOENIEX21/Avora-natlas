name: NAIC reliability gate
on:
  push:
    branches: [natlas-voice-first]
  pull_request:
    branches: [main]
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run NAIC audit
        id: naic-audit
        continue-on-error: true
        run: npm run audit:naic
      - name: Re-run behavioral gate with diagnostics
        if: steps.naic-audit.outcome == 'failure'
        run: npm run test:natlas-behavior
      - name: Fail if NAIC audit failed
        if: steps.naic-audit.outcome == 'failure'
        run: exit 1
      - run: npm run typecheck
