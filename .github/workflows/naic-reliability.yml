name: NAIC reliability gate
on:
  push:
    branches: [natlas-voice-first]
  pull_request:
    branches: [main]
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:naic\n        id: naic-audit\n        continue-on-error: true\n      - name: Re-run behavioral gate with diagnostics\n        if: steps.naic-audit.outcome == 'failure'\n        run: npm run test:natlas-behavior\n      - name: Fail if NAIC audit failed\n        if: steps.naic-audit.outcome == 'failure'\n        run: exit 1
      - run: npm run typecheck
