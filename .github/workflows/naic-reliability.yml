name: NAIC reliability gate
on:
  push:
    branches: [natlas-voice-first]
  pull_request:
    branches: [main]
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run audit:naic
      - run: npm run typecheck
